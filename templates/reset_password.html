<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | CampusOne</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-shell" style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <main class="login-card" style="width:min(100%,480px);background:#fff;padding:32px;border-radius:20px;box-shadow:0 20px 70px #14243b18">
    <span class="eyebrow blue">CAMPUSONE SECURITY</span><h1>Set a new password</h1>
    <p class="muted">Choose a new password for your account. This reset link is valid for 30 minutes.</p>
    <form id="reset-form">
      <label for="new-password">New password</label><input id="new-password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
      <label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" minlength="8" maxlength="64" autocomplete="new-password" required>
      <p id="reset-message" class="error" role="status"></p>
      <button class="primary full" type="submit">Reset password</button>
    </form>
    <p style="margin-top:18px"><a href="/">Return to CampusOne login</a></p>
  </main>
  <script>
    const token = {{ token|tojson }};
    document.getElementById('reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = document.getElementById('reset-message');
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      if (newPassword !== confirmPassword) { message.textContent = 'Passwords do not match.'; return; }
      try {
        const response = await fetch('/api/reset-password', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:newPassword,confirm_password:confirmPassword})});
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Unable to reset password.');
        message.classList.remove('error'); message.textContent = result.message + ' Redirecting to login…';
        setTimeout(() => location.href='/', 1800);
      } catch (error) { message.textContent = error.message; }
    });
  </script>
</body>
</html>
